name = "blockwork-library"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Only the custom domain, so sign-in cookies and OAuth callbacks share one host.
workers_dev = false
routes = [
  { pattern = "community.blockworked.com", custom_domain = true },
  # The helpdesk (src/support.ts). Same Worker, so it shares accounts with the library.
  { pattern = "support.blockworked.com", custom_domain = true },
]

[vars]
# Enable after following docs/accounts.md; this requires migrations 0012–0014 even when disabled.
LOCAL_AUTH_ENABLED = "true"
AUTH_FROM = "noreply@blockworked.com"
# The address the site is served at; OAuth callbacks go to <SITE_URL>/auth/<provider>/callback.
SITE_URL = "https://community.blockworked.com"
# The main site, which the top nav shared with it links to (src/site-nav.ts).
MAIN_SITE_URL = "https://blockworked.com"
LIBRARY_NAME = "Blockwork community blocks"
# Account ids allowed to review, like "github:123", comma-separated.
ADMINS = "github:39657565"
# The helpdesk. support@ mail reaches the Worker through an Email Routing rule.
SUPPORT_URL = "https://support.blockworked.com"
SUPPORT_FROM = "support@blockworked.com"
# Told about pack submissions, new tickets and requester replies, comma-separated.
SUPPORT_NOTIFY = "ethan@blockworked.com"
# Account ids who answer tickets besides ADMINS, comma-separated.
SUPPORT_STAFF = ""
# Sign-in cookies cover support.blockworked.com too.
COOKIE_DOMAIN = "blockworked.com"

[[d1_databases]]
binding = "DB"
database_name = "blockwork-library"
database_id = "d99e2800-5159-4d2f-949a-a92508b6f2ec"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "blockwork-library"

# Secrets (wrangler secret put, or .dev.vars locally):
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# NTFY_TOPIC (private topic), NTFY_TOKEN (optional access token),
# DISCORD_WEBHOOK_URL (channel webhook URL)
# Set NTFY_URL as a var for a self-hosted server; defaults to https://ntfy.sh.
# SMTP2GO_API_KEY (ticket/account email; account mail never logs tokens),
# AUTH_TOTP_KEY (32 random bytes in base64url, no padding; encrypts authenticator seeds)

# Memory-hard password hashing needs a paid Workers plan. Benchmark before rollout.
[limits]
cpu_ms = 30000

[triggers]
crons = ["17 * * * *"]

